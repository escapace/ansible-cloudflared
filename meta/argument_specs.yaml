---
argument_specs:
  main:
    short_description: install the cloudflared binary on RedHat-family hosts
    options:
      cloudflared_version:
        description: Latest stable release on each run, or an exact YYYY.M.P release tag.
        type: str
        default: latest
      cloudflared_checksum:
        description: Optional SHA-256 override for the resolved version and architecture.
        type: str
        default: ""
      cloudflared_checksums:
        description: Embedded SHA-256 checksums keyed by exact release tag, then amd64 or arm64.
        type: dict
