---
cloudflared_architecture: "{{ cloudflared_architecture_map[ansible_facts['architecture']] }}"

# vars file for escapace.cloudflared

cloudflared_architecture_map:
  64-bit: amd64

  aarch64: arm64
  amd64: amd64
  x86_64: amd64
cloudflared_binary: cloudflared-linux-{{ cloudflared_architecture }}
cloudflared_embedded_checksum: >-
  {{
    cloudflared_checksum
    if cloudflared_checksum | length > 0
    else cloudflared_checksums.get(cloudflared_resolved_version, {}).get(cloudflared_architecture, '')
  }}
cloudflared_release_api_url: >-
  https://api.github.com/repos/cloudflare/cloudflared/releases/{{
    'latest' if cloudflared_version == 'latest' else 'tags/' ~ cloudflared_version
  }}
cloudflared_url: https://github.com/cloudflare/cloudflared/releases/download/{{ cloudflared_resolved_version }}/{{ cloudflared_binary }}
